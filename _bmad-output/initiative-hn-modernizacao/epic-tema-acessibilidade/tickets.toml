# tickets.toml — epic-tema-acessibilidade: entradas planejadas na ordem de construção.
# A ordem das tabelas é a ordem de construção; ids são estáveis. Status não fica aqui.

[[entry]]
id = 1
type = "story"
title = "Tema claro e escuro nas duas telas"
description = "Aplica os tokens de tema existentes à listagem e ao detalhe, segue a preferência do sistema na primeira visita e mantém a escolha manual apenas durante a sessão da aba."
verify = "`npm run e2e` local confirma tema inicial conforme a preferência do sistema, alternância manual nas telas de lista e detalhe e persistência em `sessionStorage` após navegar e recarregar na mesma aba, sem persistir entre abas ou sessões."
covers = ["RF-07"]
after = ["1.4", "2.5", "2.6", "3.3", "3.4"]
hitl = false
risk = "medium"
notes = ["Assumption: a escolha manual sobrevive à navegação e à recarga enquanto a aba está aberta; sessionStorage é usado apenas para o tema RF-07, nunca para o estado de recolhimento dos comentários."]

[[entry]]
id = 2
type = "story"
title = "Layout responsivo, texto ampliado e alvos de toque"
description = "Ajusta lista, detalhe, abas e árvore para 320 px e 375 px sem rolagem horizontal da página, permanece legível com a fonte do sistema aumentada sem truncar controles e mantém alvos de toque com pelo menos 44 px."
verify = "`npm run e2e` local mede as telas de lista e detalhe em 320 px e 375 px com escala de texto do sistema/browser aumentada; confirma ausência de rolagem horizontal e truncamento de controles, operação preservada e dimensões mínimas de 44 px para os alvos de toque."
covers = ["RNF-09"]
after = [1]
hitl = false
risk = "medium"
notes = ["Assumption: quando o runner não puder alterar a escala tipográfica do sistema, usar aumento de texto do browser como proxy automatizado; a aceitação manual 4.5 verifica a configuração real disponível no dispositivo."]

[[entry]]
id = 3
type = "story"
title = "Teclado, foco e semântica acessível"
description = "Completa navegação por teclado e semântica acessível nas categorias, paginação, tema e árvore, com foco visível, rótulos, estados anunciados e movimento reduzido respeitado."
verify = "`npm run e2e` local percorre as seis abas com setas e Tab, paginação, controles de tema e expandir/recolher comentários só com teclado; confirma foco visível, ativação, rótulos, `aria-expanded` e ausência de transições quando movimento reduzido é preferido."
covers = ["RNF-04"]
after = [2]
hitl = false
risk = "high"
notes = ["Risk check: a aceitação HITL da entrada 5 verifica a ordem de leitura e os anúncios com leitor de tela/tecnologia assistiva; assertions de DOM não substituem essa revisão humana."]

[[entry]]
id = 4
type = "story"
title = "Auditoria axe local nas telas e temas"
description = "Acrescenta a auditoria axe ao fluxo local e corrige violações críticas ou sérias nas telas principais em tema claro e escuro, sem depender de CI."
verify = "`npm run e2e` local audita lista e detalhe nos dois temas e termina sem violações axe críticas ou sérias."
covers = ["RNF-04", "RNF-09"]
after = [3]
hitl = false
risk = "high"
notes = ["Risk check: a aprovação axe é evidência automatizada apenas e não substitui a validação manual com AT e checklist WCAG da entrada 5."]

[[entry]]
id = 5
type = "story"
title = "Aceitação manual de acessibilidade"
description = "Uma pessoa percorre lista e detalhe em celular usando teclado e leitor de tela/tecnologia assistiva, valida foco, ordem de leitura, rótulos, anúncios, contraste, fonte ampliada e alvos de toque, registra o checklist WCAG 2.1 AA e abre trabalho para qualquer falha observada."
verify = "Uma pessoa registra o checklist WCAG 2.1 AA e evidências da configuração de leitor de tela/AT usada nos fluxos de lista e detalhe em 320 px e 375 px; qualquer falha observada permanece como trabalho aberto, nunca como aceitação presumida."
covers = ["RNF-04", "RNF-09"]
after = [4]
hitl = false
risk = "high"
notes = ["HITL: teste com leitor de tela/tecnologia assistiva e registro do checklist exigem uma pessoa; axe ou teste automatizado não podem marcá-los como aceitos."]

[[entry]]
id = 6
type = "story"
title = "Reconciliação final das evidências do SDLC"
description = "Depois dos épicos de plataforma, listagem e história, uma pessoa reconcilia as sete fases do SDLC, confirma que os artefatos finais estão versionados e revalida no README os comandos locais e o Compose."
verify = "Uma pessoa verifica no repositório evidência versionada para cada fase do SDLC, executa localmente `npm run check`, `npm run build`, `npm run e2e` e o caminho Compose descrito no README, e registra qualquer lacuna como trabalho ainda aberto."
covers = []
after = [1, 2, 3, 4, 5, "1.8", "1.9", "2.6", "3.4"]
hitl = false
risk = "high"
notes = ["HITL: a reconciliação O-05 é uma verificação humana após os resultados finais; 1.8/1.9 fornecem o sweep e inventário da plataforma, mas não comprovam artefatos ainda não produzidos."]

[[entry]]
id = 7
type = "story"
title = "Refactor sweep"
description = "Limpa apenas débitos e achados adiados de tema, acessibilidade e layout, reconciliando as entradas 1 a 6 sem alterar código de listagem/história fora do escopo nem ampliar o trabalho."
verify = "`npm run check`, `npm run build` e `npm run e2e` locais passam, e a revisão confirma tema, acessibilidade, responsividade e evidências sem alterar os resultados aceitos anteriormente."
covers = []
after = [1, 2, 3, 4, 5, 6]
hitl = false
risk = "low"
