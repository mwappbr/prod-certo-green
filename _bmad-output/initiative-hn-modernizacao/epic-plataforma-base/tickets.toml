[[entry]]
id = 9
type = "story"
title = "Artefatos do SDLC versionados e processo documentado"
description = "Organiza e versiona os artefatos de planejamento e de plataforma já produzidos até este épico, cria um inventário rastreável das fases do SDLC e documenta o processo no README. Não afirma que implementação, testes, revisão ou aceite dos épicos consumidores ainda não construídos estejam concluídos: a reconciliação de todos os artefatos finais de O-05 pertence à entrada 4.6. Sem autorização para commit, preparar os artefatos e registrar o versionamento como pendente, nunca simular conclusão."
verify = "O inventário aponta para os artefatos de planejamento e plataforma existentes, identifica as evidências futuras ou ausentes e é ligado pelo README; git ls-files comprova os artefatos efetivamente versionados. Evidências não rastreadas ou commit não autorizado continuam pendentes e não satisfazem o aceite final O-05 da entrada 4.6."
covers = []
after = [7]
hitl = false
risk = "low"

[[entry]]
id = 8
type = "story"
title = "Refactor sweep"
description = "Limpeza diferida somente das entregas de plataforma das entradas 1 a 7 e 9: configuração, health, ferramentas locais, empacotamento e documentação; nada de escopo novo. O sweep não altera features de listagem, história, comentários ou tema, contratos públicos compartilhados, tokens consumidos pelas telas, chaves de cache ou interfaces de handoff já usadas pelos épicos consumidores. Achados fora desses limites são registrados para o proprietário, não corrigidos concorrentemente."
verify = "Lint, typecheck e npm run check passam sem alterar o comportamento de /api/health nem da configuração; o diff fica restrito às áreas de plataforma e não modifica contratos, tokens ou features dos consumidores."
covers = []
after = [1, 2, 3, 4, 5, 6, 7, 9]
hitl = false
risk = "low"
