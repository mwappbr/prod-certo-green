# tickets.toml — epic-listagem: entradas planejadas na ordem de construção.
# A ordem das tabelas é a ordem de construção; ids são estáveis. Status não fica aqui.

[[entry]]
id = 1
type = "story"
title = "Tracer: primeira página top ponta a ponta"
description = "Entrega a primeira página top da API oficial até a lista SPA usando os tokens 1.4 existentes; define em `shared/contract` os envelopes `StoriesPage`, `ItemResponse` e `CommentsResponse` e os tipos `Story`/`CommentNode`, implementa `fetchItem` com cache inicial de item, e fornece o runner E2E local `npm run e2e` com fixtures compartilhadas para os épicos 2 e 3."
verify = "`npm run check` e `npm run e2e` locais confirmam que a página top usa os tokens existentes e o contrato normalizado sem expor o formato bruto do HN, que a repetição de `fetchItem` para o mesmo id dentro do TTL faz apenas uma chamada HN, e que a fixture do tracer executa pelo runner criado nesta entrada."
covers = ["RF-01", "RF-03", "RF-10", "RNF-02"]
after = ["1.1", "1.2", "1.4", "1.5"]
hitl = false
risk = "high"
notes = ["Assumption: Playwright é o runner E2E local, sem CI; criar o comando npm run e2e e fixtures reutilizáveis aqui, pois o harness Vitest de 1.5 cobre check/unit/integration.", "Risk check: depois da fixture, confirmar localmente que timeout e falha da API oficial não derrubam a listagem nem expõem o formato bruto."]

[[entry]]
id = 2
type = "story"
title = "Adaptador e normalização das seis categorias"
description = "Completa o adaptador para top, new, best, ask, show e job e normaliza campos opcionais, URLs e itens inválidos antes de compor a resposta de listagem."
verify = "`npm run check` local com fixtures confirma as seis categorias, ausência de campos opcionais, descarte isolado de itens inválidos e URL somente HTTP ou HTTPS."
covers = ["RF-01", "RF-03", "RF-10"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "Paginação com snapshot e frescor no servidor"
description = "Entrega páginas de até 50 histórias a partir de um snapshot estável, cache de listas com `cachedAt` e `stale`, retenção de vencidos e fallback para cache vencido quando a API falha; só `app/` chama a porta e escreve chaves/TTLs de cache, sem acesso pelo adapter."
verify = "`npm run check` local com cliente HN determinístico e contador confirma snapshot idêntico entre páginas da mesma sequência, `SNAPSHOT_EXPIRED` no snapshot vencido, fallback `stale` quando a API falha, uma chamada HN para leituras repetidas da mesma lista dentro do TTL, e a regra AD-4 de que apenas `app/` lê/escreve a porta e centraliza chaves/TTLs; para RNF-01, aquecem-se as seis primeiras páginas da fixture e medem-se 30 requisições sequenciais por categoria ao endpoint Fastify `/api/stories` via `inject`, do início da chamada à resposta serializada, usando relógio monotônico; o p95 das 180 requisições deve ficar abaixo de 1 s."
covers = ["RF-02", "RF-11", "RNF-01", "RNF-02"]
after = [2]
hitl = false
risk = "high"
notes = ["Assumption: page size 30, máximo 50, TTL de lista 60 s, TTL de item 120 s e retenção de vencidos 15 min; validar os valores com a medição local sem contrariar a configuração validada da plataforma.", "Assumption: concorrência do adaptador 8, timeout 5 s e uma retentativa limitada; manter limites mesmo com a documentação atual do HN dizendo que não há limite de taxa.", "Risk check: uma pessoa repete a medição de p95 em processo local limpo após aquecer cada categoria e revisa o contador de chamadas HN, para detectar um resultado mascarado por cache ou fallback."]

[[entry]]
id = 4
type = "story"
title = "Categorias, metadados e estados da listagem"
description = "Permite abrir cada categoria pela rota `/?category=...`, voltar ao topo ao trocar categoria e apresenta título, pontuação, autor, tempo relativo, comentários, domínio quando disponível, atualização e estados de carregamento, erro e vazio."
verify = "`npm run e2e` local percorre as seis categorias e confirma rota/aba ativa, retorno ao topo, metadados, aviso stale usando fixture API com `stale=true` sem depender do fallback do servidor da entrada 3, nova tentativa, estado vazio e ausência de domínio quando a história não tem URL."
covers = ["RF-01", "RF-03", "RF-08", "RF-11", "RF-13"]
after = [1, 2]
hitl = false
risk = "medium"

[[entry]]
id = 5
type = "story"
title = "Carregar mais com snapshot e posição preservada"
description = "Acrescenta páginas somente após ação explícita em “Carregar mais”, mantém a rolagem e a categoria ao abrir e voltar do detalhe, e reinicia do início com aviso quando o servidor retorna `SNAPSHOT_EXPIRED`."
verify = "`npm run e2e` local confirma que rolar não carrega dados e só clicar em “Carregar mais” anexa itens sem pular ao topo, erro da página seguinte mantém itens existentes, retorno do detalhe restaura rota/categoria/posição, e `SNAPSHOT_EXPIRED` limpa a sequência vencida, busca a primeira página e mostra aviso ao leitor."
covers = ["RF-02", "RF-08", "RF-12"]
after = [1, 3, 4]
hitl = false
risk = "medium"

